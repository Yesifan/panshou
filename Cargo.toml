[package]
name = "pansou"
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "Local cloud-drive link search CLI"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
aes = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
brotli = "8"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
crossterm = "0.29"
directories = "6"
encoding_rs = "0.8"
eventsource-stream = "0.2"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
flate2 = "1"
futures = "0.3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.18"
md5 = "0.7"
num-bigint = "0.4"
percent-encoding = "2"
qrcode = "0.14"
quick-xml = { version = "0.38", features = ["serialize"] }
rand = "0.9"
redb = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "rustls-tls", "socks", "stream"] }
reqwest_cookie_store = "0.9"
rpassword = "7"
rqrr = "0.10"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tempfile = "3"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
