[package]
name = "pansou"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local cloud-drive link search CLI"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
aes = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
directories = "6"
encoding_rs = "0.8"
eventsource-stream = "0.2"
flate2 = "1"
futures = "0.3"
md5 = "0.7"
num-bigint = "0.4"
percent-encoding = "2"
qrcode = "0.14"
quick-xml = { version = "0.38", features = ["serialize"] }
rand = "0.9"
redb = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "rustls-tls", "socks", "stream"] }
reqwest_cookie_store = "0.9"
rpassword = "7"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
